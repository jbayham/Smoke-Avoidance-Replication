name: Source integrity and Python checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source_checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify source manifest
        run: python scripts/verify_package.py
      - name: Python runner tests
        run: python -m unittest discover -s tests -p test_runner.py
      - name: Validate graph without data
        run: python run.py plan
